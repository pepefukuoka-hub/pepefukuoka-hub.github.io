<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="にげるロボ">
<title>にげるロボ</title>
<link rel="stylesheet" href="robo.css?v=1">
</head>
<body>
<main id="start">
  <h1>にげるロボ</h1>
  <p class="lead">スマホのカメラ越しに、まわりの左右のどこかに、ロボットが立っています。見つけると、全速力で遠くへ逃げます。ロボットは、ときどき「ピッ」と鳴きます。音のする方を、さがしてください。</p>
  <label for="size">ロボットの大きさ</label>
  <select id="size"><option value="0.7">小さい</option><option value="1" selected>ふつう</option><option value="1.5">大きい</option></select>
  <label for="dist">いる距離</label>
  <select id="dist"><option value="2">近め(2 m)</option><option value="3" selected>ふつう(3 m)</option><option value="5">遠め(5 m)</option></select>
  <label for="eye">スマホを持つ高さ(目線)</label>
  <select id="eye"><option value="1.2">低め(1.2 m)</option><option value="1.4" selected>ふつう(1.4 m)</option><option value="1.6">高め(1.6 m)</option></select>
  <button type="button" id="go" class="primary">はじめる</button>
  <p class="msg" id="msg" role="status"></p>
  <p class="msg">版 1</p>
  <ul class="tips">
    <li>モーションとカメラの許可を求められます。位置情報は使いません。</li>
    <li>ロボットは、はじめ、あなたの左右にいます。ゆっくり見回してください。</li>
    <li>画面に入ってしばらく見ていると、気づかれて、逃げます。逃げたあとは、しばらくして、また別の場所に戻ってきます。</li>
    <li>映像は、この端末の中だけで使います。どこにも送りません。</li>
  </ul>
  <p class="msg"><a href="../">← 一覧にもどる</a></p>
</main>
<video id="cam" playsinline muted autoplay></video>
<div id="host"></div>
<div id="hud" hidden>
  <button type="button" id="exit">戻る</button>
  <div id="find" aria-live="polite"></div>
</div>
<script src="robo.js?v=1"></script>
</body>
</html>
