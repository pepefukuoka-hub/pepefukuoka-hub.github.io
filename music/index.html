<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="音楽ツール">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/svg+xml" href="../icons/music.svg">
<title>音楽ツール</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root { --bg: #0b1020; --fg: #f1f4ff; --muted: #9aa5c4; --line: rgba(255,255,255,.1); --glass: rgba(255,255,255,.06); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; background: var(--bg); color: var(--fg); font: 16px/1.6 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; -webkit-font-smoothing: antialiased;
  padding: calc(env(safe-area-inset-top, 0px) + 36px) max(18px, env(safe-area-inset-right, 0px)) max(40px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); overflow-x: hidden; }
/* うしろで、ゆっくり動く光 */
.glow { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.glow i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(80px); opacity: .32; animation: drift 24s ease-in-out infinite alternate; }
.glow i:nth-child(1) { background: #7c5cff; top: -25vmax; left: -15vmax; }
.glow i:nth-child(2) { background: #06b6d4; bottom: -30vmax; right: -20vmax; animation-delay: -8s; }
.glow i:nth-child(3) { background: #f43f5e; width: 40vmax; height: 40vmax; top: 35%; left: 55%; opacity: .16; animation-delay: -15s; }
@keyframes drift { to { transform: translate3d(6vmax, 5vmax, 0) scale(1.15); } }
main { max-width: 760px; margin: 0 auto; }
header { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
header img { width: 68px; height: 68px; border-radius: 16px; box-shadow: 0 8px 30px rgba(124,92,255,.45), 0 0 0 1px var(--line); flex: none; }
h1 { font-size: 32px; line-height: 1.15; margin: 0; letter-spacing: .04em; background: linear-gradient(90deg, #fff, #b9c4ff 60%, #e9b8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
h2 { display: flex; align-items: center; gap: 10px; margin: 30px 0 12px; font-size: 12px; font-weight: 600; letter-spacing: .22em; color: var(--muted); }
h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
a.card { --c: #7c5cff; position: relative; display: flex; gap: 16px; align-items: center; text-decoration: none; color: inherit; border-radius: 20px; padding: 14px 16px 14px 14px; min-height: 92px;
  background: linear-gradient(135deg, rgba(255,255,255,.09), rgba(255,255,255,.03)); border: 1px solid var(--line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
a.card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--c) 30%, transparent), transparent 60%); opacity: .6; pointer-events: none; transition: opacity .2s; }
a.card:hover, a.card:focus-visible { transform: translateY(-3px); border-color: color-mix(in srgb, var(--c) 70%, #fff 0%); box-shadow: 0 14px 34px color-mix(in srgb, var(--c) 35%, transparent); outline: none; }
a.card:hover::before, a.card:focus-visible::before { opacity: 1; }
a.card:active { transform: scale(.98); }
a.card img { position: relative; width: 62px; height: 62px; flex: none; border-radius: 15px; box-shadow: 0 6px 18px color-mix(in srgb, var(--c) 55%, transparent); }
.tx { position: relative; min-width: 0; flex: 1; }
.tx b { display: block; font-size: 18px; letter-spacing: .02em; }
.tx span { display: block; color: var(--muted); font-size: 13px; line-height: 1.45; margin-top: 2px; }
a.card::after { content: "›"; position: relative; color: var(--muted); font-size: 26px; line-height: 1; flex: none; transition: transform .2s, color .2s; }
a.card:hover::after { transform: translateX(3px); color: var(--fg); }
.note { margin: 34px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
@media (prefers-reduced-motion: reduce) { .glow i { animation: none; } a.card, a.card::after { transition: none; } }
@media (max-width: 380px) { h1 { font-size: 27px; } header img { width: 56px; height: 56px; } }
.qr{margin-top:22px;border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:var(--glass);color:var(--muted)}.qr summary{cursor:pointer;font-weight:600;color:var(--fg)}.qr img{display:block;margin:14px auto 6px;background:#fff;padding:10px;border-radius:12px}.qr p{text-align:center;font-size:13px;margin:6px 0 0}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <header>
    <img src="../icons/music.svg" alt="" width="68" height="68">
    <div>
      <h1>音楽ツール</h1>
      <p class="sub">ブラウザの中だけで動きます。曲や動画は、外に送られません。</p>
    </div>
  </header>

  <div class="grid">
    <a class="card" style="--c:#22d3ee" href="stem-ai/"><img src="../icons/stem-ai.svg" alt="" width="62" height="62"><div class="tx"><b>AIで楽器ごとに分ける</b><span>曲から、ボーカル・ギター・ドラムなどを取り出す</span></div></a>
    <a class="card" style="--c:#10b981" href="video-audio/"><img src="../icons/video-audio.svg" alt="" width="62" height="62"><div class="tx"><b>動画から音を取り出す</b><span>動画の音だけを、WAV か MP3 で保存</span></div></a>
    <a class="card" style="--c:#f59e0b" href="cut/"><img src="../icons/cut.svg" alt="" width="62" height="62"><div class="tx"><b>音と動画を切り取る</b><span>音楽でも動画でも、いらない所を切って保存</span></div></a>
  </div>

  <details class="qr"><summary>このページの QR コード</summary><img src="qr.svg" alt="このページを開く QR コード" width="220" height="220"><p>スマホで読み取ると、このページが開きます。</p></details>
  <p class="note">自分で楽しむ範囲で使ってください。曲や動画の著作権に、気をつけてください。</p>
</main>
</body>
</html>
